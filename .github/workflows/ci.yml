name: CI

# Lint, type-check and test on every pull request and every push to main (work is pushed straight
# to main, so pull-request-only CI would never run). Offline: no network, no real data.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repo-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No binary databases or data exports committed (releases replace them)
        run: |
          bad=$(git ls-files | grep -E '\.(duckdb|duckdb\.wal|parquet|sqlite|db|xlsx)$' || true)
          if [ -n "$bad" ]; then echo "::error::binary data files are tracked in git:"; echo "$bad"; exit 1; fi
      - name: No .env committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then echo "::error::.env is tracked in git"; exit 1; fi

  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Type-check (mypy)
        run: mypy
      - name: Tests
        run: pytest -q tests

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect api/
        id: detect
        run: echo "present=$([ -f api/pyproject.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Skip (api/ not built yet)
        if: steps.detect.outputs.present != 'true'
        run: echo "api/ does not exist yet; nothing to check."
      - uses: actions/setup-python@v5
        if: steps.detect.outputs.present == 'true'
        with:
          python-version: "3.12"
      - name: Lint, type-check and test the API
        if: steps.detect.outputs.present == 'true'
        working-directory: api
        run: |
          pip install -e ".[dev]"
          ruff check .
          mypy
          pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect web/
        id: detect
        run: echo "present=$([ -f web/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Skip (web/ not built yet)
        if: steps.detect.outputs.present != 'true'
        run: echo "web/ does not exist yet; nothing to check."
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: "20"
      - name: Lint, type-check and test the web app
        if: steps.detect.outputs.present == 'true'
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
