name: Weekly SG healthcare scrape

on:
  schedule:
    - cron: "0 0 * * 0"        # Sundays 00:00 UTC = 08:00 SGT
  workflow_dispatch:            # lets you run it manually from the Actions tab
    inputs:
      sources:
        description: "Comma-separated sources (moh,live,opendata,singstat)"
        required: false
        default: "moh,live,opendata,singstat"

permissions:
  contents: write               # needed to push the updated DuckDB snapshot

concurrency:
  group: weekly-scraper
  cancel-in-progress: false     # never let two runs write the DB at the same time

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DB_PATH: data/singapore_healthcare.duckdb
      REPORT_PATH: reports/SG_Healthcare_Scrape_Report.xlsx
      DATAGOV_API_KEY: ${{ secrets.DATAGOV_API_KEY }}          # optional
      SINGSTAT_POP_TABLE_ID: ${{ vars.SINGSTAT_POP_TABLE_ID }} # optional repo variable
      CRAWLER_USER_AGENT: >-
        SGHealthcareResearchCrawler/1.0 (non-commercial portfolio research;
        +https://github.com/${{ github.repository }})

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt

      - name: Install Chromium for the Playwright fallback
        run: python -m playwright install --with-deps chromium

      - name: Run tests
        run: pytest -q pipeline/tests

      - name: Run pipeline
        run: |
          mkdir -p data reports
          python pipeline/sg_health_pipeline.py --db "$DB_PATH" --report "$REPORT_PATH" \
            run --sources "${{ github.event.inputs.sources || 'moh,live,opendata,singstat' }}"

      - name: Commit updated snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DB_PATH" "$REPORT_PATH"
          if git diff --cached --quiet; then
            echo "No data changes this week."
            exit 0
          fi
          git commit -m "data: weekly scrape $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash
          git push

      - name: Upload report as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sg-healthcare-report
          path: ${{ env.REPORT_PATH }}
          if-no-files-found: ignore
          retention-days: 30
