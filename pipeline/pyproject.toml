[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sg-health-pipeline"
version = "0.2.0"
description = "ETL for Singapore ED bed waits, attendances, live waits and clinic access for residents 65+"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pandas>=2.1",
    "openpyxl>=3.1",
    "duckdb>=1.0",
    # Geospatial marts: every distance and area is computed in SVY21 (EPSG:3414), which needs
    # pyproj for reprojection; geopandas gives buffers, overlays and spatial joins on top of shapely.
    # Pipeline only (CLAUDE.md): the API never imports these.
    "shapely>=2.1",          # coverage_simplify (shared borders stay shared) needs 2.1+
    "pyproj>=3.6",
    "geopandas>=1.0",
    "python-dotenv>=1.0",    # loads a local .env if present (never required; env vars win)
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]   # optional fallback for JavaScript-rendered pages
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10", "types-requests"]   # CI lint and type checks

[project.scripts]
sg-health = "sg_health.cli:main"

[tool.setuptools.packages.find]
include = ["sg_health*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]       # offline unit tests; acceptance/ (real data) is run explicitly

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
# pycodestyle errors/warnings, pyflakes, import order, modern syntax, likely bugs (bugbear).
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # line length: long SQL and messages; to be enforced once wrapped (lenient start)
    "E731",   # small named lambdas are used deliberately in tests and helpers
    "B905",   # zip(strict=...): many zips are over columns of the same DataFrame
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]          # tests import fixtures after helper definitions
"acceptance/*" = ["E402"]

[tool.mypy]
# Lenient to start (the codebase wasn't written typed): no pandas stubs, untyped defs allowed.
# Tighten step by step; CI runs exactly this configuration.
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
files = ["sg_health"]
