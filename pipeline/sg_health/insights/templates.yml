# Sentences for each detector. Rules (docs/language_rules.md), checked when rendered:
#   headline: one sentence, at most 20 words; detail: at most 2 sentences
#   no causal words (causes, drives, leads to, because); no database column names
#   placeholders are filled with formatted values: hours to 1 decimal, percentages whole,
#   counts with thousands separators; {n|area|areas} picks singular or plural
#   {hospital} and {area} are full names (first mention)
#
# The site's labels around each insight's key number, also checked (a phrase of at most 12 words,
# no full stop, same word rules):
#   metric_label      what the key number is (required)
#   comparison_label  what it is compared with, with that value; shown after "vs" (optional)
#   change_word       the word beside the arrow, e.g. "higher than usual" (optional)
#   callout           the chart annotation pointing at the difference the headline describes (required)

trend:
  worse:
    headline: "Bed waits at {hospital} have risen about {slope} a week over the last {weeks} weeks."
    detail: "Its trend line moved from {start} to {end}: a steady rise, not one bad week."
    metric_label: "Average change in bed wait each week"
    change_word: "rising"
    callout: "About {slope} a week over {weeks} weeks"
  better:
    headline: "Bed waits at {hospital} have fallen about {slope} a week over the last {weeks} weeks."
    detail: "Its trend line moved from {start} to {end}: a steady fall, not one good week."
    metric_label: "Average change in bed wait each week"
    change_word: "falling"
    callout: "About {slope} a week over {weeks} weeks"

anomaly:
  worse:
    headline: "Bed waits at {hospital} were unusually long in the week of {week}: {value}."
    detail: "The usual level over the {trailing} weeks before was {usual}."
    metric_label: "Average of daily median bed waits, week of {week}"
    comparison_label: "{usual}, usual for this hospital"
    change_word: "higher than usual"
    callout: "{week}: {value}"
  better:
    headline: "Bed waits at {hospital} were unusually short in the week of {week}: {value}."
    detail: "The usual level over the {trailing} weeks before was {usual}; one good week is not yet a trend."
    metric_label: "Average of daily median bed waits, week of {week}"
    comparison_label: "{usual}, usual for this hospital"
    change_word: "lower than usual"
    callout: "{week}: {value}"

usual_gap:
  worse:
    headline: "{hospital}: bed wait {value}, {pct} above its usual {usual} (week of {week})."
    detail: "Usual is the median of the {trailing} weeks before."
    metric_label: "Average of daily median bed waits, week of {week}"
    comparison_label: "{usual}, usual for this hospital"
    change_word: "higher than usual"
    callout: "{week}: {pct} above usual"

weekday:
  hospital:
    headline: "At {hospital}, bed waits are longest on {weekday}s, {pct} above its weekly average."
    detail: "Waits differ by day of the week over {weeks} complete weeks."
    metric_label: "Average of daily median bed waits on {weekday}s"
    comparison_label: "{mean}, its weekly average"
    change_word: "higher than average"
    callout: "{weekday}s: {pct} above average"
  pooled:
    headline: "Across all hospitals, bed waits are longest on {weekday}s, {pct} above each hospital's weekly average."
    detail: "Waits differ by day of the week at {n_hospitals} {n_hospitals|hospital|hospitals} over {weeks} complete weeks."
    metric_label: "Daily median bed waits on {weekday}s, compared with each hospital's average"
    comparison_label: "{mean}, each hospital's own average"
    change_word: "higher than average"
    callout: "{weekday}s: {pct} above average"

  hospital_tie:
    headline: "At {hospital}, bed waits peak on {days}, {pct} and {pct2} above its weekly average."
    detail: "Waits differ by day of the week over {weeks} complete weeks; the two peak days are too close to tell apart."
    metric_label: "Average of daily median bed waits on {weekday}s"
    comparison_label: "{mean}, its weekly average"
    change_word: "higher than average"
    callout: "{days} peak: {pct} and {pct2} above average"
  pooled_tie:
    headline: "Across all hospitals, bed waits peak on {days}, {pct} and {pct2} above each hospital's weekly average."
    detail: "Waits differ by day of the week at {n_hospitals} {n_hospitals|hospital|hospitals} over {weeks} complete weeks; the two peak days are too close to tell apart."
    metric_label: "Daily median bed waits on {weekday}s, compared with each hospital's average"
    comparison_label: "{mean}, each hospital's own average"
    change_word: "higher than average"
    callout: "{days} peak: {pct} and {pct2} above average"

volume_vs_wait:
  positive:
    headline: "At {hospital}, bed waits move {strength} with ED visits {lag_phrase}."
    detail: "Busier days come with longer bed waits, over {n} days after removing the usual weekday pattern."
    metric_label: "Correlation of ED visits with the bed wait {after_phrase}"
    change_word: "{strength_label} link"
    callout: "{lead} the busiest days: {diff} {longer_shorter} than {lead_lower} the quietest"
  negative:
    headline: "At {hospital}, bed waits move {strength} against ED visits {lag_phrase}."
    detail: "Busier days come with shorter bed waits, over {n} days after removing the usual weekday pattern."
    metric_label: "Correlation of ED visits with the bed wait {after_phrase}"
    change_word: "{strength_label} link"
    callout: "{lead} the busiest days: {diff} {longer_shorter} than {lead_lower} the quietest"

monthly_yoy:
  positive:
    headline: "Across the full EDs, months with higher visits than a year before tend to have longer bed waits."
    detail: "Each month is set against the same month a year before, over {n} months, so the usual yearly pattern is removed."
    metric_label: "Correlation of the change in visits with the change in bed wait"
    change_word: "{strength_label} link"
    callout: "Highest-visit months: wait change {diff} points {higher_lower} than lowest"
  negative:
    headline: "Across the full EDs, months with higher visits than a year before tend to have shorter bed waits."
    detail: "Each month is set against the same month a year before, over {n} months, so the usual yearly pattern is removed."
    metric_label: "Correlation of the change in visits with the change in bed wait"
    change_word: "{strength_label} link"
    callout: "Highest-visit months: wait change {diff} points {higher_lower} than lowest"

access_gap:
  worse:
    headline: "{area} has about {shortfall} fewer CDMP GP {shortfall_n|clinic|clinics} than the benchmark rate would give its seniors."
    detail: "It has {actual} {actual_n|clinic|clinics} for {seniors} residents aged 65+, where the benchmark rate suggests {expected}; clinics are counted where they are, not where patients go."
    metric_label: "CDMP GP clinics per 1,000 residents aged 65+ in {area}"
    comparison_label: "{national}, the benchmark rate"
    change_word: "lower than the benchmark rate"
    callout: "About {shortfall} {shortfall_n|clinic|clinics} short of the benchmark rate"

source_gap:
  neutral:
    headline: "NUHS's live bed-wait estimate for NUH differs from MOH's daily figure by a median {gap}."
    detail: "This compares {n} days with both figures, which measure different things: a moment's estimate against the day's median for admitted patients."
    metric_label: "Median daily gap, NUHS estimate minus MOH figure"
    comparison_label: "{moh}, MOH's median daily figure"
    change_word: "{above_below} MOH's figure"
    callout: "Median daily gap: {gap}"

# One sentence per evidence level, added after every detail (docs/insights_method.md, "Evidence levels").
# Only a tested finding may speak of chance, and only with its adjusted p-value as odds; the engine
# refuses probability words in a finding without one.
evidence:
  observed: "An observed difference, not a statistical test."
  tested: "A test says this is unlikely to be chance: the odds are {chance}, allowing for every test run."
  robust: "A test says this is unlikely to be chance (odds {chance}, allowing for every test run), and its 95% range excludes no difference."
  association-only: "An association only: unlikely to be chance (odds {chance}), but it does not show why bed waits move."
